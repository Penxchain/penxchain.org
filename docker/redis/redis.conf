# Minimal redis.conf tuned for local development
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Memory policy for cache-like behavior
maxmemory 0
maxmemory-policy noeviction

# Security (for local dev you can set a password in .env and REDIS_URL)
# requirepass foobared

# Recommended: enable AOF for durability in dev
dir /data
